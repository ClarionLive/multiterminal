<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/css/xterm.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        #terminal-container {
            width: 100%;
            height: 100%;
        }
        /* Reserve the scrollbar gutter permanently so the viewport's usable width
           NEVER changes when the vertical scrollbar shows/hides. fitAddon.proposeDimensions()
           subtracts the LIVE scrollbar width; without a stable gutter that width flips 0<->10px
           as content overflow toggles, which at some window widths lands on a 1-column boundary
           and makes proposeDimensions oscillate (e.g. 97<->98 cols). The 2s drift heartbeat then
           refits on every tick, reflowing the whole grid — the "terminal blanks/repaints every
           ~2s" flash (task 5e36e90b, rescoped from the Project-panel guard). Stable gutter keeps
           the width constant → proposeDimensions stable → no per-tick refit. */
        .xterm-viewport {
            scrollbar-gutter: stable;
        }
        /* Hide scrollbar in xterm viewport for cleaner look - scrolling still works */
        .xterm-viewport::-webkit-scrollbar {
            width: 10px;
        }
        .xterm-viewport::-webkit-scrollbar-track {
            background: transparent;
        }
        .xterm-viewport::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 5px;
        }
        .xterm-viewport::-webkit-scrollbar-thumb:hover {
            background: #666;
        }
    </style>
</head>
<body>
    <div id="terminal-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@6.0.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.11.0/lib/addon-fit.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-web-links@0.12.0/lib/addon-web-links.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-unicode11@0.9.0/lib/addon-unicode11.min.js"></script>

    <script>
        // Theme definitions matching TerminalTheme.cs
        const themes = {
            dark: {
                background: '#0C0C0C',
                foreground: '#CCCCCC',
                cursor: '#FFFFFF',
                cursorAccent: '#000000',
                selectionBackground: '#264F78',
                selectionForeground: '#FFFFFF',
                black: '#0C0C0C',
                red: '#C50F1F',
                green: '#13A10E',
                yellow: '#C19C00',
                blue: '#0037DA',
                magenta: '#881798',
                cyan: '#3A96DD',
                white: '#CCCCCC',
                brightBlack: '#767676',
                brightRed: '#E74856',
                brightGreen: '#16C60C',
                brightYellow: '#F9F1A5',
                brightBlue: '#3B78FF',
                brightMagenta: '#B4009E',
                brightCyan: '#61D6D6',
                brightWhite: '#F2F2F2'
            },
            light: {
                background: '#FFFFFF',
                foreground: '#1E1E1E',
                cursor: '#000000',
                cursorAccent: '#FFFFFF',
                selectionBackground: '#ADD6FF',
                selectionForeground: '#000000',
                black: '#1E1E1E',
                red: '#C50F1F',
                green: '#13A10E',
                yellow: '#C19C00',
                blue: '#0037DA',
                magenta: '#881798',
                cyan: '#3A96DD',
                white: '#CCCCCC',
                brightBlack: '#767676',
                brightRed: '#E74856',
                brightGreen: '#16C60C',
                brightYellow: '#F9F1A5',
                brightBlue: '#3B78FF',
                brightMagenta: '#B4009E',
                brightCyan: '#61D6D6',
                brightWhite: '#F2F2F2'
            }
        };

        let term = null;
        let fitAddon = null;
        let currentFontSize = 10;
        let isInitialized = false;

        // Initialize terminal
        function initTerminal(themeName = 'dark') {
            const container = document.getElementById('terminal-container');

            term = new Terminal({
                cursorBlink: false,
                cursorStyle: 'block',
                fontFamily: '"Cascadia Mono", Consolas, "Courier New", monospace',
                fontSize: currentFontSize,
                theme: themes[themeName] || themes.dark,
                allowProposedApi: true,
                scrollback: 10000,
                convertEol: false,
                letterSpacing: -1,
                lineHeight: 1
            });

            // Load addons
            fitAddon = new FitAddon.FitAddon();
            term.loadAddon(fitAddon);

            const webLinksAddon = new WebLinksAddon.WebLinksAddon();
            term.loadAddon(webLinksAddon);

            // Unicode 11 width tables. xterm.js defaults to Unicode 6, in which
            // many modern emoji (🧪, 📎, 🌟, etc.) are NOT classified as wide.
            // ConPTY on Windows 10/11 treats them as 2-cell. Without this addon,
            // every wide-emoji glyph creates 1 column of cumulative cursor-position
            // drift between xterm.js and ConPTY — manifests as column-aligned
            // stray characters when subsequent ANSI cursor-relative redraws
            // (e.g. menu re-renders) land in the wrong columns.
            const unicode11Addon = new Unicode11Addon.Unicode11Addon();
            term.loadAddon(unicode11Addon);
            term.unicode.activeVersion = '11';

            // Open terminal in container
            term.open(container);

            // Initial fit
            fitAddon.fit();

            // Custom key handler for Windows-style shortcuts
            term.attachCustomKeyEventHandler((event) => {
                // ESC while the host's Shift+Right-click menu is open dismisses the menu and is
                // swallowed (GH #24: the reporter's Esc, meant for the menu, reached the app as an
                // abort — the key lands in WebView2, never in the ContextMenuStrip). Every event
                // type is swallowed, and so is auto-repeat until the key is released, so neither
                // keydown, a repeat nor keyup leaks through. This is the SECOND line: the host
                // normally handles Esc first (WebViewTerminalRenderer.OnWebViewKeyDown) and this
                // page never sees it (11edbec4). A non-repeat keydown with the menu closed is a NEW
                // press: the dismissing press's keyup was lost, so it ends the swallow and reaches
                // the app (so does window blur, below).
                if (event.key === 'Escape' && swallowEscapeUntilKeyUp && !contextMenuOpen &&
                        event.type === 'keydown' && !event.repeat) {
                    swallowEscapeUntilKeyUp = false;
                }
                if (event.key === 'Escape' && (contextMenuOpen || swallowEscapeUntilKeyUp)) {
                    if (event.type === 'keydown' && contextMenuOpen) {
                        contextMenuOpen = false;
                        swallowEscapeUntilKeyUp = true;
                        sendToHost({ type: 'dismissContextMenu' });
                    } else if (event.type === 'keyup') {
                        swallowEscapeUntilKeyUp = false;
                    }
                    return false;
                }

                // Shift+F10 and the Apps/Menu key open the host menu from the keyboard (11edbec4).
                // They must be taken here, before xterm: xterm 6.0.0 maps Shift+F10 to ESC[21;2~
                // (Keyboard.ts, keyCode 121), sends that to the app and preventDefaults the keydown,
                // so Chromium never raised 'contextmenu' for it. Every event type is swallowed and
                // default-prevented, so nothing reaches the app and the browser's own keyboard
                // 'contextmenu' is suppressed (the listener below also dedupes it). Never pastes.
                if (isKeyboardMenuKey(event)) {
                    event.preventDefault();
                    if (event.type === 'keydown' && !event.repeat) {
                        openContextMenuFromKeyboard();
                    }
                    return false;
                }

                // CTRL+C: Copy if text selected, otherwise let it pass as interrupt
                if (event.ctrlKey && event.key === 'c' && event.type === 'keydown') {
                    const selection = term.getSelection();
                    if (selection && selection.length > 0) {
                        // Route copy through the C# host. The page is hosted from a
                        // file:// URL where navigator.clipboard.writeText silently fails,
                        // so the host writes the Windows clipboard (mirrors the paste path).
                        sendToHost({ type: 'copy', selectedText: selection });
                        return false; // Prevent default (don't send to terminal)
                    }
                    // No selection - let CTRL+C pass through as interrupt
                    return true;
                }

                // CTRL+V (any case: Caps Lock / Ctrl+Shift+V give 'V') and SHIFT+Insert: request
                // the paste from C#, which strips control characters (GH #24). preventDefault here
                // stops the browser's native paste event, which xterm would otherwise handle with
                // the RAW clipboard text; the capture-phase 'paste' listener in initTerminal is the
                // backstop for any paste keystroke this misses.
                const isPasteKey =
                    (event.ctrlKey && (event.key === 'v' || event.key === 'V')) ||
                    (event.shiftKey && !event.ctrlKey && !event.altKey && event.key === 'Insert');
                if (isPasteKey && event.type === 'keydown') {
                    event.preventDefault();
                    event.stopPropagation();
                    requestPaste();
                    return false; // Prevent xterm.js from processing
                }

                // CTRL+Enter / SHIFT+Enter: Send LF (newline) instead of CR (carriage return).
                // Shift+Enter is the chat-UI convention (GH #22). event.key is 'Enter' for the
                // numpad Enter key too, so NumpadEnter behaves identically in every case.
                // Ctrl+Shift+Enter also lands here and sends LF.
                if ((event.ctrlKey || event.shiftKey) && event.key === 'Enter') {
                    if (event.type === 'keydown') {
                        sendToHost({ type: 'input', data: btoa('\n') });
                    }
                    // Swallow keypress/keyup too. xterm's _keyPress emits charCode 13 as CR unless
                    // Ctrl/Alt/Meta is held, so for Shift+Enter returning true on keypress would
                    // send LF then CR — a newline AND a submit (checked in xterm 6.0.0's source).
                    return false; // Prevent default Enter behavior
                }

                // Let all other keys pass through normally
                return true;
            });

            // OSC 52 clipboard handler. TUI apps running inside the terminal
            // (Claude Code, vim, tmux, etc.) copy to the clipboard by emitting an
            // OSC 52 escape sequence (ESC ] 52 ; <target> ; <base64> BEL) rather
            // than touching the system clipboard directly. xterm.js does not write
            // the host clipboard for OSC 52 on its own, so without this the app's
            // "copied N chars" succeeds from its point of view but nothing lands on
            // the Windows clipboard. Route the payload through the same host copy
            // path used by Ctrl-C / right-click so OnCopyRequested writes it.
            // xterm strips the leading "52;" and hands us "<target>;<base64>".
            term.parser.registerOscHandler(52, (data) => {
                try {
                    const sep = data.indexOf(';');
                    const payload = sep >= 0 ? data.slice(sep + 1) : data;
                    // "?" is a clipboard *read* query — we don't support reporting
                    // the clipboard back, so let xterm handle/ignore it.
                    if (!payload || payload === '?') {
                        return false;
                    }
                    let text;
                    try {
                        const binary = atob(payload);
                        const bytes = Uint8Array.from(binary, (c) => c.charCodeAt(0));
                        text = new TextDecoder('utf-8').decode(bytes);
                    } catch (e) {
                        // Malformed base64 — not ours to handle cleanly.
                        return false;
                    }
                    if (text) {
                        sendToHost({ type: 'copy', selectedText: text });
                    }
                    return true; // handled; suppress default xterm processing
                } catch (e) {
                    return false;
                }
            });

            // Handle user input - send to C#
            // Use TextEncoder to properly encode multi-byte (UTF-8) characters before Base64
            term.onData((data) => {
                sendToHost({ type: 'input', data: utf8ToBase64(data) });
            });

            // Handle resize - notify C#
            term.onResize((size) => {
                sendToHost({ type: 'resize', cols: size.cols, rows: size.rows });
            });

            // Handle title changes
            term.onTitleChange((title) => {
                sendToHost({ type: 'title', title: title });
            });

            // Refit xterm.js whenever anything changes the rendering area.
            // window.resize alone misses content-driven shifts (scrollbar appearance
            // when scrollback first exceeds viewport, async font load changing cell
            // metrics, layout reflows inside WebView2 that never bubble to the OS
            // window). When the cell grid drifts without xterm.js refitting, ConPTY
            // keeps writing assuming the old cols/rows while xterm.js renders at
            // slightly different effective dims — surfaces as column-aligned stray
            // characters appearing 1-3 rows away from where they belong.
            let resizeTimeout = null;
            const scheduleRefit = () => {
                if (resizeTimeout) {
                    clearTimeout(resizeTimeout);
                }
                resizeTimeout = setTimeout(() => {
                    if (fitAddon) {
                        fitAddon.fit();
                    }
                    resizeTimeout = null;
                }, 50);
            };

            // ResizeObserver catches container size changes from any cause.
            if (typeof ResizeObserver !== 'undefined') {
                const ro = new ResizeObserver(scheduleRefit);
                ro.observe(container);
            }

            // Kept as a defensive fallback in case the observer is ever silenced.
            window.addEventListener('resize', scheduleRefit);

            // Heartbeat: catches silent drift that ResizeObserver cannot see.
            // Container size can stay constant while xterm.js's effective cell
            // grid changes — async font load, glyph fallback the first time a
            // box-drawing char is rendered, internal renderer rebuild after
            // scrollback fills, DPI/zoom shifts WebView2 swallows. Compares
            // xterm's currently-believed cols/rows against what fitAddon would
            // propose right now; if they disagree, refit so ConPTY gets
            // re-synced via term.onResize. Cheap (~one font-metric calc per tick).
            //
            // Anti-oscillation damper (task 5e36e90b): proposeDimensions() can be
            // unstable on a 1-column boundary (its live scrollbar-width term flips as
            // overflow toggles), making it bounce e.g. 97<->98 forever. Each refit
            // reflowed the whole grid every 2s — a visible full-terminal blank/repaint.
            // The scrollbar-gutter:stable CSS above removes the usual cause; this guard
            // is defense-in-depth: refuse a refit that would send us straight BACK to the
            // size we just left (that's oscillation, not drift). Genuine drift proposes a
            // NEW stable target and still corrects; real container resizes go through the
            // ResizeObserver's direct fit(), not this heartbeat, so they're unaffected.
            let prevBeforeHeartbeatFit = null;
            setInterval(() => {
                if (!term || !fitAddon) return;
                try {
                    const proposed = fitAddon.proposeDimensions();
                    if (!proposed || !proposed.cols || !proposed.rows) return;
                    if (proposed.cols === term.cols && proposed.rows === term.rows) {
                        prevBeforeHeartbeatFit = null; // stable — clear the oscillation guard
                        return;
                    }
                    // Would this refit just bounce us back to the size the previous heartbeat
                    // fit left? Then it's a ±1 oscillation — suppress it and stay put.
                    if (prevBeforeHeartbeatFit &&
                        proposed.cols === prevBeforeHeartbeatFit.cols &&
                        proposed.rows === prevBeforeHeartbeatFit.rows) {
                        return;
                    }
                    console.warn(`[Terminal] Drift detected: term=${term.cols}x${term.rows}, proposed=${proposed.cols}x${proposed.rows}. Refitting.`);
                    prevBeforeHeartbeatFit = { cols: term.cols, rows: term.rows };
                    fitAddon.fit();
                } catch (e) {
                    // proposeDimensions can throw if container is detached — ignore.
                }
            }, 2000);

            // Handle Ctrl+mousewheel for font size
            container.addEventListener('wheel', (e) => {
                if (e.ctrlKey) {
                    e.preventDefault();
                    const delta = e.deltaY > 0 ? -1 : 1;
                    const newSize = Math.max(6, Math.min(32, currentFontSize + delta));
                    if (newSize !== currentFontSize) {
                        setFontSize(newSize);
                        // Notify C# of font size change so it can be saved
                        sendToHost({ type: 'fontSizeChanged', fontSize: newSize });
                    }
                }
            }, { passive: false });

            // Right-click (GH #24): copy if there is a selection, otherwise paste — the Windows
            // Terminal convention — and no menu. Shift+Right-click opens the host context menu
            // (Copy / Paste / Save as Prompt / Clear / Rename Tab / Launch as).
            //
            // Right-button mousedown/mouseup are stopped in the CAPTURE phase, before xterm.js
            // (whose listeners sit on descendant elements) sees them. That does two things:
            //  - xterm does not clear the selection on right mousedown, so the contextmenu
            //    handler below still has the text to copy or to hand to the menu;
            //  - no right-button mouse report reaches an app that enabled mouse tracking, so a
            //    right-click is one action (MT's) and never also the app's.
            // Stopping propagation here also skips the bubble-phase 'terminalclick' listener
            // further down, so the right mousedown sends it itself (it closes an open menu).
            //
            // rightButtonPressed marks a contextmenu as mouse-driven. A contextmenu with no right
            // mousedown before it (a touch long-press, or a keyboard contextmenu the key handler
            // did not take) opens the menu and must never paste the clipboard unasked (in cmd.exe
            // a multi-line paste executes). Shift+F10 and the Apps key do NOT come through here:
            // the custom key handler above opens the menu for them and suppresses the browser's
            // own contextmenu, and a keyboard contextmenu that still arrives is dropped below.
            let rightButtonPressed = false;
            // A stale flag must not turn a later non-mouse contextmenu into a paste: clear it on
            // any non-modifier keydown (modifiers are skipped because a held Ctrl or Shift
            // auto-repeats keydown between the mousedown and its contextmenu) and on blur.
            window.addEventListener('keydown', (e) => {
                if (e.key !== 'Shift' && e.key !== 'Control' && e.key !== 'Alt' && e.key !== 'Meta') {
                    rightButtonPressed = false;
                }
            }, true);
            window.addEventListener('blur', () => {
                rightButtonPressed = false;
                swallowEscapeUntilKeyUp = false; // the dismissing Esc's keyup will land elsewhere
            });
            container.addEventListener('mousedown', (e) => {
                if (e.button === 2) {
                    e.stopPropagation();
                    rightButtonPressed = true;
                    sendToHost({ type: 'terminalclick' });
                }
            }, true);
            container.addEventListener('mouseup', (e) => {
                if (e.button === 2) {
                    e.stopPropagation();
                }
            }, true);

            container.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                e.stopPropagation();
                const selectedText = (term && term.hasSelection()) ? term.getSelection() : '';
                const fromMouse = rightButtonPressed;
                rightButtonPressed = false;

                if (!fromMouse && (contextMenuOpen ||
                        performance.now() - keyboardMenuRequestedAt < KEYBOARD_MENU_DEDUPE_MS)) {
                    // The browser's own contextmenu for a menu key the key handler already
                    // acted on: opening again would show a second menu.
                    return;
                }

                if (e.shiftKey || !fromMouse) {
                    requestContextMenu(e.clientX, e.clientY, selectedText);
                    return;
                }

                if (selectedText.length > 0) {
                    sendToHost({ type: 'copy', selectedText: selectedText });
                    term.clearSelection();
                } else {
                    requestPaste();
                }
                term.focus();
            }, true);

            // Backstop for the native browser paste (GH #24 run 2): any 'paste' event — from a
            // keystroke the key handler does not recognise, or anything else — would otherwise
            // reach xterm's own listener on its textarea and be sent with the RAW clipboard text,
            // skipping the host's control-character stripping. Caught in the CAPTURE phase on the
            // container (the textarea is a descendant), cancelled, and re-routed to the host.
            container.addEventListener('paste', (e) => {
                e.preventDefault();
                e.stopPropagation();
                requestPaste();
            }, true);

            // Notify C# when terminal is clicked (for dropdown close)
            container.addEventListener('mousedown', () => {
                sendToHost({ type: 'terminalclick' });
            });

            isInitialized = true;

            // Notify C# that terminal is ready
            sendToHost({ type: 'ready', cols: term.cols, rows: term.rows });
        }

        // Send message to C# host
        function sendToHost(message) {
            if (window.chrome && window.chrome.webview) {
                window.chrome.webview.postMessage(message);
            }
        }

        // True while the host's terminal menu is showing. Set here as soon as the page asks for a
        // menu, so an Esc pressed before the host's "contextMenu:1" arrives is still swallowed;
        // the host's "contextMenu:1"/"contextMenu:0" then keep it in step however the menu closes.
        let contextMenuOpen = false;
        // Set when an Esc dismissed the menu: its auto-repeats and its keyup are swallowed too.
        // (Both flags are mirrored host-side in WebViewTerminalRenderer.)
        let swallowEscapeUntilKeyUp = false;
        // When the key handler last opened the menu from the keyboard (performance.now()).
        let keyboardMenuRequestedAt = -Infinity;
        const KEYBOARD_MENU_DEDUPE_MS = 1000;

        // Shift+F10, or the Apps/Menu key (event.key 'ContextMenu'), with no Ctrl/Alt/Meta.
        function isKeyboardMenuKey(event) {
            if (event.ctrlKey || event.altKey || event.metaKey) return false;
            return event.key === 'ContextMenu' || (event.key === 'F10' && event.shiftKey);
        }

        // Every menu request goes through here — mouse (Shift+Right-click) and keyboard alike.
        function requestContextMenu(x, y, selectedText) {
            contextMenuOpen = true;
            sendToHost({ type: 'contextmenu', x: x, y: y, selectedText: selectedText });
        }

        function openContextMenuFromKeyboard() {
            const pos = keyboardMenuPosition();
            keyboardMenuRequestedAt = performance.now();
            requestContextMenu(pos.x, pos.y, (term && term.hasSelection()) ? term.getSelection() : '');
        }

        // Just below and right of the cursor cell when the cursor is on screen, else the centre
        // of the terminal. Whole CSS pixels, like the mouse path's clientX/clientY (the host's
        // message parser reads unsigned integers only).
        function keyboardMenuPosition() {
            const el = document.querySelector('#terminal-container .xterm-screen') ||
                document.getElementById('terminal-container');
            const rect = el.getBoundingClientRect();
            const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, Math.round(v)));
            const left = Math.max(0, rect.left);
            const top = Math.max(0, rect.top);
            if (term && term.cols > 0 && term.rows > 0) {
                const buf = term.buffer.active;
                const row = buf.baseY + buf.cursorY - buf.viewportY;
                if (row >= 0 && row < term.rows) {
                    const cellW = rect.width / term.cols;
                    const cellH = rect.height / term.rows;
                    return {
                        x: clamp(rect.left + Math.min(buf.cursorX + 1, term.cols) * cellW, left, left + rect.width),
                        y: clamp(rect.top + (row + 1) * cellH, top, top + rect.height)
                    };
                }
            }
            return {
                x: clamp(rect.left + rect.width / 2, left, left + rect.width),
                y: clamp(rect.top + rect.height / 2, top, top + rect.height)
            };
        }

        // Every user paste from the page starts here: Ctrl+V in any case, Ctrl+Shift+V,
        // Shift+Insert, mouse right-click, and — via the capture-phase 'paste' listener — any
        // native browser paste event. (The menu's Paste enters host-side, calling the same C#
        // PasteFromClipboard this request reaches.) The host reads the clipboard (text
        // with control characters stripped, or a bitmap saved to a temp PNG whose path is pasted)
        // and answers with "paste:<base64 utf-8>", which handleHostMessage hands to term.paste().
        function requestPaste() {
            sendToHost({ type: 'paste' });
        }

        // UTF-8 encode then Base64, in slices. A paste arrives through onData as ONE string, and
        // String.fromCharCode(...bytes) over the whole thing throws a RangeError once the byte
        // count exceeds the engine's argument limit — the paste would silently vanish.
        function utf8ToBase64(text) {
            const bytes = new TextEncoder().encode(text);
            const SLICE = 0x8000;
            let binary = '';
            for (let i = 0; i < bytes.length; i += SLICE) {
                binary += String.fromCharCode.apply(null, bytes.subarray(i, i + SLICE));
            }
            return btoa(binary);
        }

        // Shared by terminal output ('data') and pastes ('paste'). The & 0xFF mask is needed for
        // multi-byte UTF-8 (emoji).
        function base64ToUtf8(b64) {
            const binaryString = atob(b64);
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) {
                bytes[i] = binaryString.charCodeAt(i) & 0xFF;
            }
            return new TextDecoder('utf-8').decode(bytes);
        }

        // ── Typing queue ────────────────────────────────────────────────────────────────────
        // Every 'typeInput' payload is typed to completion before the next one starts.
        //
        // WHY A QUEUE AND NOT A BARE setTimeout CHAIN (task 7806024f, pipeline Run 1 debugger):
        // each message used to start its OWN independent chain, with no queue and no mutual
        // exclusion. Two overlapping senders therefore interleaved their characters into a single
        // composer — and because every payload carries its own trailing CR (see
        // WebViewTerminalRenderer.TypeInputViaXterm, which appends the line ending to the text
        // before base64), the result was not one corrupted line but TWO garbled submissions.
        // Nothing detected it: the C# side had already recorded the delivery as complete.
        //
        // The overlap only became reachable when spawned-helper delivery moved from t+120s to
        // t+~5s, which put it in the same window as OnClaudeCodeDetected's "initializing..."
        // injection (banner + 1.5s, 20ms/char). At 120s the two spans could never meet, which is
        // why this latent race survived until the trigger changed.
        //
        // The ordering below IS the fix: drainTypeQueue() runs the next job only from the
        // completion of the previous one. Do not "optimize" it into a per-message chain.
        const typeQueue = [];
        let typeInFlight = false;

        function enqueueTypeInput(decoded, charDelay) {
            typeQueue.push({ decoded, charDelay });
            if (!typeInFlight) {
                drainTypeQueue();
            }
        }

        function drainTypeQueue() {
            const job = typeQueue.shift();
            if (!job) {
                typeInFlight = false;
                return;
            }

            typeInFlight = true;
            let charIndex = 0;
            const typeNextChar = () => {
                // The try/catch is the UNWEDGE PATH, and it is deliberate belt-and-braces.
                // Run 2's debugger enumerated the throw sources and found none reachable today:
                // sendToHost is feature-guarded, btoa only ever sees atob output (all code points
                // <= 255), and a zero-length payload throws in the handler before it is ever
                // queued. The code-reviewer still wanted the guard, and that call was taken,
                // because the cost of being wrong is asymmetric: an escaping throw would leave
                // typeInFlight true forever and every later keystroke in this pane would queue
                // and silently never be typed. A per-message failure is recoverable; a permanently
                // wedged pane is the exact silent-failure class this ticket exists to remove.
                try {
                    if (charIndex < job.decoded.length) {
                        sendToHost({ type: 'input', data: btoa(job.decoded[charIndex]) });
                        charIndex++;
                        setTimeout(typeNextChar, job.charDelay);
                    } else {
                        // This job's last character — including its trailing CR — has been sent.
                        // Only now does the next job start. One charDelay has already elapsed since
                        // that final character, so successive jobs keep the same inter-key spacing.
                        drainTypeQueue();
                    }
                } catch (e) {
                    // Drop THIS job and keep the pane usable, rather than wedging every future one.
                    // ⚠️ NOT a clean abort: characters already sent are sitting in the composer with
                    // no trailing CR, so the next job types onto that same line. This trades a
                    // permanently dead pane for one corrupted line — deliberately, because the pane
                    // can be recovered by the human and a wedge cannot.
                    sendToHost({ type: 'log', level: 'error', message: 'typeInput job aborted: ' + e });
                    drainTypeQueue();
                }
            };
            typeNextChar();
        }

        // Handle messages from C#
        function handleHostMessage(message) {
            if (!term) return;

            if (typeof message === 'string') {
                // Simple string protocol: "command:data"
                const colonIndex = message.indexOf(':');
                if (colonIndex > 0) {
                    const command = message.substring(0, colonIndex);
                    const data = message.substring(colonIndex + 1);

                    switch (command) {
                        case 'data':
                            // Base64 encoded terminal data - decode as UTF-8 (see base64ToUtf8)
                            term.write(base64ToUtf8(data));
                            break;

                        case 'theme':
                            setTheme(data);
                            break;

                        case 'fontSize':
                            setFontSize(parseFloat(data));
                            break;

                        case 'clear':
                            term.clear();
                            break;

                        case 'reset':
                            term.reset();
                            break;

                        case 'focus':
                            term.focus();
                            break;

                        case 'paste':
                            // Clipboard text from the host (reply to requestPaste). term.paste()
                            // normalises line endings to CR and, when the app has enabled
                            // bracketed paste (DECSET 2004 — ConPTY passes the app's request
                            // through to xterm), wraps it in ESC[200~ … ESC[201~, so the app sees
                            // ONE paste rather than typed keys. Native terminals paste the same
                            // way; the old path wrote raw text to ConPTY with no bracket (GH #24).
                            if (data.length > 0) {
                                term.paste(base64ToUtf8(data));
                            }
                            break;

                        case 'contextMenu':
                            contextMenuOpen = data === '1';
                            sendToHost({ type: 'log', level: 'trace', message: 'contextMenu flag from host: ' + data });
                            break;

                        case 'scrollToBottom':
                            term.scrollToBottom();
                            break;

                        case 'typeInput':
                            // Character-by-character injection — mimics real keyboard typing
                            // (e.g. the "initializing..." banner and prompt auto-answers).
                            // Format: "typeInput:delayMs:base64data"
                            // Each character is sent individually through the xterm input path
                            // with a configurable delay between keystrokes.
                            {
                                let charDelay = 15;
                                let charData = data;
                                const delayMatch = data.match(/^(\d+):(.+)$/);
                                if (delayMatch) {
                                    charDelay = parseInt(delayMatch[1], 10);
                                    charData = delayMatch[2];
                                }
                                // Queued, not started directly: a second typeInput arriving while
                                // this one is still typing must wait its turn rather than
                                // interleave its characters into the same composer.
                                enqueueTypeInput(atob(charData), charDelay);
                            }
                            break;

                        case 'sendEnter':
                            // Simulate Enter key by sending CR through the input path
                            // This goes through the same channel as physical keypresses
                            //
                            // Format: "sendEnter:jobId" (task f420feeb). The id is OPAQUE here — it is
                            // minted by the C# caller and echoed back untouched on every ack below, so
                            // the host can match the reply to the request that sent it. Two injections
                            // into one terminal overlap routinely (each is an async void handler on the
                            // UI thread, so every await lets the next one start), and without this id
                            // the host cannot tell whose Enter was acknowledged.
                            const enterJobId = data;

                            // Capture cursor position BEFORE sending Enter
                            const cursorYBefore = term.buffer.active.cursorY;
                            const cursorXBefore = term.buffer.active.cursorX;

                            sendToHost({ type: 'input', data: btoa('\r') });

                            // Poll for cursor movement after the CR.
                            // ⚠️ This proves only that SOMETHING moved the cursor within 500ms. It
                            // does NOT prove a prompt was submitted (task 8b270b37): a CR the
                            // composer takes as a NEWLINE moves the cursor to a new line too, and
                            // the timeout branch below acks anyway so the host cannot hang.
                            const startTime = Date.now();
                            const maxWaitMs = 500; // Wait up to 500ms for cursor movement

                            const checkCursorMoved = () => {
                                const cursorYAfter = term.buffer.active.cursorY;
                                const cursorXAfter = term.buffer.active.cursorX;
                                const elapsed = Date.now() - startTime;

                                // The cursor moved (to another row, or back towards column 0) —
                                // not necessarily a submission; see the warning above.
                                if (cursorYAfter !== cursorYBefore || cursorXAfter < cursorXBefore) {
                                    sendToHost({ type: 'enterAck', enterJobId: enterJobId });
                                    return;
                                }

                                // Timeout: Enter wasn't processed
                                if (elapsed >= maxWaitMs) {
                                    console.warn(`[Terminal] Enter key timeout after ${elapsed}ms - cursor didn't move (Y: ${cursorYBefore} -> ${cursorYAfter}, X: ${cursorXBefore} -> ${cursorXAfter})`);
                                    // Still ack to prevent hang — and ack the SAME job, so the caller
                                    // that is actually waiting is the one released.
                                    sendToHost({ type: 'enterAck', enterJobId: enterJobId });
                                    return;
                                }

                                // Keep polling every 10ms
                                setTimeout(checkCursorMoved, 10);
                            };

                            // Start polling after brief delay to let terminal process
                            setTimeout(checkCursorMoved, 20);
                            break;
                    }
                }
            }
        }

        // Set theme
        function setTheme(themeName) {
            const theme = themes[themeName] || themes.dark;
            if (term) {
                term.options.theme = theme;
                document.body.style.backgroundColor = theme.background;
            }
        }

        // Set font size
        function setFontSize(size) {
            size = Math.max(6, Math.min(32, size));
            currentFontSize = size;
            if (term) {
                term.options.fontSize = size;
                if (fitAddon) {
                    fitAddon.fit();
                }
            }
        }

        // Get selected text from terminal (exposed to C# via window object)
        function getSelectedText() {
            return (term && term.hasSelection()) ? term.getSelection() : '';
        }
        window.terminalGetSelection = getSelectedText;

        // Listen for messages from C#
        if (window.chrome && window.chrome.webview) {
            window.chrome.webview.addEventListener('message', (event) => {
                handleHostMessage(event.data);
            });
        }

        // Initialize on load
        document.addEventListener('DOMContentLoaded', () => {
            initTerminal('dark');
        });

        // Also handle case where DOM is already loaded
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            setTimeout(() => {
                if (!isInitialized) {
                    initTerminal('dark');
                }
            }, 0);
        }
    </script>
</body>
</html>
