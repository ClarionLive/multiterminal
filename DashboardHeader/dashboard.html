<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  :root {
    --bg: #1e1e2e;
    --bg-hover: #313244;
    --bg-active: #45475a;
    --text: #cdd6f4;
    --text-dim: #6c7086;
    --accent: #89b4fa;
    --green: #a6e3a1;
    --yellow: #f9e2af;
    --red: #f38ba8;
    --blue: #89b4fa;
    --mauve: #cba6f7;
    --border: #313244;
    --surface: #181825;
    --pill-border: #3a3a52;
  }

  body.light {
    --bg: #eff1f5;
    --bg-hover: #ccd0da;
    --bg-active: #bcc0cc;
    --text: #4c4f69;
    --text-dim: #6c6f85;
    --accent: #1e66f5;
    --green: #40a02b;
    --yellow: #df8e1d;
    --red: #d20f39;
    --blue: #1e66f5;
    --mauve: #8839ef;
    --border: #ccd0da;
    --surface: #e6e9ef;
    --pill-border: #bcc0cc;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    user-select: none;
  }

  .dashboard {
    display: flex;
    align-items: center;
    height: 80px;
    padding: 0 14px 10px 14px;
    gap: 10px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, var(--bg) 0%, var(--surface) 100%);
  }

  /* Logo with dropdown */
  .logo-container { position: relative; }

  .logo-btn {
    width: 40px;
    height: 40px;
    background: var(--accent);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    color: var(--bg);
    font-weight: 800;
    cursor: pointer;
    border: none;
    transition: all 0.15s ease;
  }

  .logo-btn:hover { filter: brightness(1.15); transform: scale(1.05); }


  .divider { width: 1px; height: 36px; background: var(--border); flex-shrink: 0; }

  /* Project action buttons (task 4cac608c): rounded pills, a thin line icon and a label, filled
     with the M button's accent so they stand out (Owner, live test). */
  .actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .action-btn {
    height: 38px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 14px;
    background: var(--accent);
    color: var(--bg);
    border: 1px solid var(--accent);
    border-radius: 10px;
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: filter 0.15s ease;
  }
  .action-btn:hover { filter: brightness(1.15); }
  .action-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .action-btn[aria-expanded="true"] { filter: brightness(1.15); }
  .action-btn svg { flex-shrink: 0; }
  .action-btn .chev { opacity: 0.75; }

  /* Narrow window: every action but Launch Project becomes icon-only; its title is the tooltip. */
  body.compact .action-btn.shrinks { width: 38px; padding: 0; justify-content: center; }
  body.compact .action-btn.shrinks .label { display: none; }

  /* Panel groups */
  .panel-group {
    display: flex;
    align-items: center;
    gap: 2px;
    background: var(--surface);
    border-radius: 10px;
    padding: 3px;
    border: 1px solid var(--border);
  }

  .icon-btn {
    width: 38px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s ease;
    font-size: 17px;
    color: var(--text-dim);
    background: transparent;
    border: none;
    position: relative;
  }

  .icon-btn:hover { background: var(--bg-hover); color: var(--text); }
  .icon-btn.active { background: var(--bg-active); color: var(--accent); }

  .icon-btn .badge {
    position: absolute;
    top: 2px;
    right: 2px;
    width: 16px;
    height: 16px;
    background: var(--red);
    border-radius: 50%;
    font-size: 10px;
    font-weight: 700;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }

  .icon-btn .badge.hidden { display: none; }

  /* Dashboard zone */
  .dashboard-zone {
    display: flex;
    align-items: center;
    gap: 14px;
    flex: 1;
    justify-content: flex-end;
    min-width: 0;
  }

  .project-info { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .project-name { font-weight: 600; font-size: 14px; color: var(--text); white-space: nowrap; }
  .git-branch {
    display: flex; align-items: center; gap: 5px;
    font-size: 12px; color: var(--mauve);
    background: rgba(203,166,247,0.1); padding: 3px 10px; border-radius: 12px; white-space: nowrap;
  }
  body.light .git-branch { background: rgba(136,57,239,0.1); }

  .task-info { display: flex; align-items: center; gap: 10px; min-width: 0; flex-shrink: 1; }
  .task-title { font-size: 13px; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  .task-progress { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--green); white-space: nowrap; }
  .progress-bar { width: 56px; height: 5px; background: var(--bg-active); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--green); border-radius: 3px; transition: width 0.3s ease; }

  .no-task { font-size: 13px; color: var(--text-dim); font-style: italic; }

  .gap-sm { width: 6px; flex-shrink: 0; }
</style>
</head>
<body>
<div class="dashboard">

  <!-- Logo button. Its menu opens in a separate popup window (HeaderPopupForm), because a dropdown
       inside this 80px-tall page would be clipped at its bottom edge. -->
  <div class="logo-container">
    <button class="logo-btn" id="btn-menu" aria-haspopup="menu" aria-label="MultiTerminal menu" onclick="sendPopupAction('show_menu', this, event)">M</button>
  </div>

  <!-- Project actions (task 4cac608c; these replaced "+ New", which only opened a start-screen tab) -->
  <div class="actions" id="actions">
    <button class="action-btn" id="btn-launch-project" aria-haspopup="listbox" title="Launch Project" onclick="sendPopupAction('select_project', this, event)">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6H9l2 2h8.5A1.5 1.5 0 0 1 21 9.5v8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/></svg>
      <span class="label">Launch Project</span>
      <svg class="chev" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <button class="action-btn shrinks" title="Browse All Projects" aria-label="Browse All Projects" onclick="sendAction('browse_all')">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>
      <span class="label">Browse All Projects</span>
    </button>
    <button class="action-btn shrinks" title="New Project" aria-label="New Project" onclick="sendAction('new_project')">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      <span class="label">New Project</span>
    </button>
    <button class="action-btn shrinks" title="Just Claude" aria-label="Just Claude" onclick="sendAction('just_claude')">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18M9 9l6 6M15 9l-6 6"/></svg>
      <span class="label">Just Claude</span>
    </button>
    <button class="action-btn shrinks" title="Open PowerShell" aria-label="Open PowerShell" onclick="sendAction('open_powershell')">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1zM7 10l3 2-3 2M12 15h5"/></svg>
      <span class="label">Open PowerShell</span>
    </button>
  </div>

  <div class="gap-sm"></div>

  <!-- Primary panel toggles -->
  <div class="panel-group">
    <button class="icon-btn" id="btn-projects" title="Projects" onclick="sendAction('toggle_projects')">&#128194;</button>
    <button class="icon-btn" id="btn-tasks" title="Tasks" onclick="sendAction('toggle_tasks')">&#128203;</button>
    <button class="icon-btn" id="btn-chat" title="Chat" onclick="sendAction('toggle_chat')">&#128172;</button>
    <button class="icon-btn" id="btn-activity" title="Activity" onclick="sendAction('toggle_activity')">&#9889;</button>
    <button class="icon-btn" id="btn-office" title="Office" onclick="sendAction('toggle_office')">&#127970;</button>
    <button class="icon-btn" id="btn-profiles" title="Profiles" onclick="sendAction('toggle_profiles')">&#128100;</button>
    <button class="icon-btn" id="btn-inbox" title="Inbox" onclick="sendAction('toggle_inbox')">
      &#128233;
      <span class="badge hidden" id="inboxBadge">0</span>
    </button>
    <button class="icon-btn" id="btn-attention" title="Attention (agents waiting on you)" onclick="sendAction('toggle_attention')">&#128587;</button>
  </div>

  <div class="gap-sm"></div>

  <!-- Secondary panel toggles -->
  <div class="panel-group">
    <button class="icon-btn" id="btn-debug" title="Debug" onclick="sendAction('toggle_debug')">&#128027;</button>
    <button class="icon-btn" id="btn-preview" title="Preview" onclick="sendAction('toggle_preview')">&#128196;</button>
    <button class="icon-btn" id="btn-history" title="History" onclick="sendAction('toggle_history')">&#128340;</button>
  </div>

  <div class="divider"></div>

  <!-- Dashboard zone -->
  <div class="dashboard-zone">
    <div class="project-info">
      <span class="project-name" id="projectName">—</span>
      <div class="git-branch" id="gitBranch">
        <span>&#9741;</span>
        <span id="branchName">—</span>
      </div>
    </div>

    <div class="divider"></div>

    <div class="task-info" id="taskSection">
      <span class="task-title" id="taskTitle">&#128203; No active task</span>
      <div class="task-progress" id="taskProgress" style="display:none">
        <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width: 0%"></div></div>
        <span id="progressText">0/0</span>
      </div>
    </div>
  </div>
</div>

<script>
  // ============ JS → C# Communication ============
  function sendAction(action) {
    if (window.chrome && window.chrome.webview) {
      window.chrome.webview.postMessage({ type: 'action', action: action });
    }
  }

  // The M menu and the project picker open under their button, so send its position (CSS px).
  // A click with detail 0 came from the keyboard (Enter/Space): the popup then focuses its first item.
  function sendPopupAction(action, btn, ev) {
    if (!(window.chrome && window.chrome.webview)) return;
    const r = btn.getBoundingClientRect();
    window.chrome.webview.postMessage({
      type: 'action', action: action,
      rect: { x: r.left, y: r.top, w: r.width, h: r.height },
      keyboard: !!ev && ev.detail === 0
    });
  }

  // ============ Narrow window ============
  // Labels go first when the right-hand project/task info would be squeezed below a readable
  // width; measured rather than a fixed breakpoint, so it holds at any zoom level.
  const MIN_INFO_WIDTH = 260;
  function fitActions() {
    document.body.classList.remove('compact');
    const zone = document.querySelector('.dashboard-zone');
    if (zone && zone.clientWidth < MIN_INFO_WIDTH) document.body.classList.add('compact');
  }
  window.addEventListener('resize', fitActions);
  fitActions();

  // ============ C# → JS Communication ============
  if (window.chrome && window.chrome.webview) {
    window.chrome.webview.addEventListener('message', (event) => {
      const msg = event.data;

      // String messages
      if (typeof msg === 'string') {
        if (msg.startsWith('theme:')) {
          document.body.classList.toggle('light', msg === 'theme:light');
        } else if (msg.startsWith('fontSize:')) {
          document.body.style.fontSize = msg.split(':')[1] + 'px';
        }
        return;
      }

      // JSON messages
      if (msg.type === 'project') {
        updateProject(msg);
      } else if (msg.type === 'task') {
        updateTask(msg);
      } else if (msg.type === 'inbox_count') {
        updateInboxBadge(msg.count);
      } else if (msg.type === 'panel_state') {
        updatePanelState(msg.panel, msg.visible);
      } else if (msg.type === 'version') {
        document.getElementById('appVersion').textContent = 'MultiTerminal ' + msg.version;
      }
    });
  }

  // ============ Update Functions ============
  function updateProject(data) {
    document.getElementById('projectName').textContent = data.name || '—';
    document.getElementById('branchName').textContent = data.branch || '—';
  }

  function updateTask(data) {
    const titleEl = document.getElementById('taskTitle');
    const progressEl = document.getElementById('taskProgress');
    const fillEl = document.getElementById('progressFill');
    const textEl = document.getElementById('progressText');

    if (!data.title) {
      titleEl.textContent = '\u{1F4CB} No active task';
      progressEl.style.display = 'none';
      return;
    }

    titleEl.textContent = '\u{1F4CB} ' + data.title;
    titleEl.title = data.title;
    if (data.total > 0) {
      progressEl.style.display = 'flex';
      const pct = Math.round((data.done / data.total) * 100);
      fillEl.style.width = pct + '%';
      textEl.textContent = data.done + '/' + data.total;
    } else {
      progressEl.style.display = 'none';
    }
  }

  function updateInboxBadge(count) {
    const badge = document.getElementById('inboxBadge');
    if (count > 0) {
      badge.textContent = count > 99 ? '99+' : count;
      badge.classList.remove('hidden');
    } else {
      badge.classList.add('hidden');
    }
  }

  function updatePanelState(panel, visible) {
    const btn = document.getElementById('btn-' + panel);
    if (btn) {
      btn.classList.toggle('active', visible);
    }
  }


  // ============ Ready Signal ============
  if (window.chrome && window.chrome.webview) {
    window.chrome.webview.postMessage({ type: 'ready' });
  }
</script>
</body>
</html>
