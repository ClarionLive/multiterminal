<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Project Notes</title>
<style>
body {
    --bg-primary: #1a1a2e;
    --bg-editor: #1e1e30;
    --bg-header: #12122a;
    --bg-tab: #1e1e30;
    --bg-tab-active: #2a2a4a;
    --bg-tab-hover: #252545;
    --border: #2a2a4a;
    --text-primary: #e0e0e0;
    --text-secondary: #a0a0b8;
    --text-muted: #707088;
    --accent: #89b4fa;
    --save-indicator: #a6e3a1;
    --danger: #f38ba8;
    --drop-indicator: #89b4fa;
    --mark: rgba(137, 180, 250, 0.30);

    margin: 0; padding: 0;
    font-family: "Segoe UI", system-ui, sans-serif;
    font-size: 12px;
    background: var(--bg-primary);
    color: var(--text-primary);
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
}

body.light {
    --bg-primary: #f5f5f5;
    --bg-editor: #ffffff;
    --bg-header: #e8e8e8;
    --bg-tab: #e0e0e0;
    --bg-tab-active: #ffffff;
    --bg-tab-hover: #ebebeb;
    --border: #dcdcdc;
    --text-primary: #333333;
    --text-secondary: #666666;
    --text-muted: #999999;
    --accent: #1e66f5;
    --save-indicator: #40a02b;
    --danger: #d20f39;
    --drop-indicator: #1e66f5;
    --mark: rgba(30, 102, 245, 0.18);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

.notes-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 12px;
    background: var(--bg-header);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
}

.notes-title {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-secondary);
}

.save-status {
    font-size: 9px;
    color: var(--text-muted);
    transition: color 0.3s ease;
}
.save-status.saved { color: var(--save-indicator); }
.save-status.saving { color: var(--accent); }
.save-status.conflict { color: var(--danger); }

/* ── Body: rail + editor (task 9a4a9d5e; replaced the tab strip) ── */
.body-row { flex: 1; display: flex; min-height: 0; position: relative; }

.rail {
    position: relative;
    display: flex;
    flex-direction: column;
    background: var(--bg-header);
    border-right: 1px solid var(--border);
    flex-shrink: 0;
    min-width: 0;
}
.rail-top { display: flex; align-items: center; gap: 4px; padding: 6px 6px 6px 8px; border-bottom: 1px solid var(--border); }
.search {
    flex: 1; min-width: 0;
    display: flex; align-items: center; gap: 5px;
    background: var(--bg-editor);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 3px 6px;
}
.search:focus-within { border-color: var(--accent); }
.search svg { flex-shrink: 0; color: var(--text-muted); }
.search input { flex: 1; min-width: 0; border: none; outline: none; background: transparent; color: var(--text-primary); font: inherit; font-size: 11px; }
.search input::placeholder { color: var(--text-muted); }
.search .clear { color: var(--text-muted); cursor: pointer; font-size: 10px; display: none; }
.search.has-text .clear { display: block; }
.icon-btn {
    width: 22px; height: 22px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    border-radius: 4px; color: var(--text-muted);
    cursor: pointer; user-select: none; font-size: 14px;
}
.icon-btn:hover { background: var(--bg-tab-hover); color: var(--accent); }
/* "Unread only" filter under the search (Owner request, live test of 9a4a9d5e) */
.unread-filter {
    display: flex; align-items: center; gap: 6px;
    padding: 0 8px 6px 9px;
    border-bottom: 1px solid var(--border);
    font-size: 10px; color: var(--text-secondary);
    cursor: pointer; user-select: none;
}
.unread-filter input { margin: 0; accent-color: var(--accent); cursor: pointer; }
.unread-filter .n { color: var(--accent); font-weight: 600; }
.rail-top { border-bottom: none; }

.rail-list { flex: 1; overflow-y: auto; padding: 2px 0 6px; outline: none; }
.rail-list::-webkit-scrollbar { width: 4px; }
.rail-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.group {
    display: flex; align-items: center; gap: 5px;
    padding: 7px 10px 3px 6px;
    font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
    color: var(--text-muted);
    cursor: pointer; user-select: none;
}
.group:hover { color: var(--text-secondary); }
.group.pinned-head { cursor: default; }
.group .caret { width: 9px; font-size: 8px; text-align: center; display: flex; justify-content: center; }
.group .count { font-weight: 600; letter-spacing: 0; }
.group .gdot { margin-left: auto; }
.group .group-edit { text-transform: none; letter-spacing: 0; font-weight: 600; }

.row {
    position: relative;
    display: flex; align-items: center; gap: 5px;
    padding: 4px 8px 4px 20px;
    cursor: pointer; user-select: none;
    color: var(--text-secondary);
}
.row:hover { background: var(--bg-tab-hover); color: var(--text-primary); }
.row.active { background: var(--bg-tab-active); color: var(--text-primary); font-weight: 600; box-shadow: inset 2px 0 0 var(--accent); }
.row.menu-target { outline: 1px solid var(--accent); outline-offset: -1px; }
.row .agent { font-size: 9px; color: var(--accent); flex-shrink: 0; }
.row .name-wrap { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.row .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 11px; }
.row.unread .name { color: var(--text-primary); font-weight: 600; }
.row .snippet { font-size: 10px; font-weight: 400; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.row .time { font-size: 9px; color: var(--text-muted); font-weight: 400; flex-shrink: 0; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
.row.drop-above::before, .row.drop-below::after {
    content: ''; position: absolute; left: 8px; right: 8px; height: 2px;
    background: var(--drop-indicator); border-radius: 1px;
}
.row.drop-above::before { top: -1px; }
.row.drop-below::after { bottom: -1px; }
.row.dragging { opacity: .4; }
mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }
.inline-edit {
    width: 100%;
    background: var(--bg-editor); color: var(--text-primary);
    border: 1px solid var(--accent); border-radius: 2px;
    font: inherit; font-size: 11px; padding: 1px 4px; outline: none;
}
.confirm {
    display: flex; align-items: center; gap: 6px;
    margin: 2px 6px 4px 20px; padding: 5px 7px;
    border: 1px solid var(--danger); border-radius: 4px;
    background: var(--bg-tab-active);
    font-size: 10px; color: var(--text-primary);
}
.confirm span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.confirm button { padding: 2px 8px; border: none; border-radius: 3px; font-size: 10px; cursor: pointer; font-family: inherit; }
.confirm .btn-yes { background: var(--danger); color: #fff; }
.confirm .btn-no { background: var(--border); color: var(--text-primary); }
.empty { padding: 14px 10px; color: var(--text-muted); font-size: 11px; text-align: center; }

.resize { position: absolute; top: 0; right: -3px; width: 6px; height: 100%; cursor: col-resize; z-index: 2; }
.resize::after { content: ''; position: absolute; left: 2px; top: 0; bottom: 0; width: 2px; background: transparent; transition: background .15s; }
.resize:hover::after, body.resizing .resize::after { background: var(--accent); }
body.resizing { cursor: col-resize; user-select: none; }

/* Collapsed rail: a thin strip */
.rail.collapsed { width: 30px !important; align-items: center; padding-top: 5px; gap: 4px; }
.rail.collapsed > :not(.mini) { display: none; }
.rail:not(.collapsed) > .mini { display: none; }
.mini-badge {
    min-width: 15px; height: 15px; padding: 0 4px; border-radius: 8px;
    background: var(--accent); color: var(--bg-primary);
    font-size: 9px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
}
.mini-sep { width: 14px; height: 1px; background: var(--border); }

/* Narrow HUD: an expanded rail floats over the editor */
.rail.overlay { position: absolute; top: 0; left: 0; bottom: 0; z-index: 3; box-shadow: 4px 0 14px rgba(0, 0, 0, .35); }
.scrim { position: absolute; inset: 0; background: rgba(0, 0, 0, .25); z-index: 2; display: none; }
body.overlay-open .scrim { display: block; }

/* Right-click menu and the category list (body-appended, position:fixed) */
.menu {
    position: fixed; z-index: 10;
    min-width: 150px; max-height: 70vh; overflow-y: auto;
    background: var(--bg-tab-active);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 3px 0;
    box-shadow: 0 4px 12px rgba(0, 0, 0, .3);
    font-size: 11px;
}
.menu .mi { display: flex; align-items: center; gap: 8px; padding: 4px 12px 4px 10px; color: var(--text-secondary); cursor: pointer; white-space: nowrap; user-select: none; }
.menu .mi:hover, .menu .mi.hot { background: var(--bg-tab-hover); color: var(--text-primary); }
.menu .mi.disabled { opacity: .45; cursor: default; }
.menu .mi.disabled:hover { background: transparent; color: var(--text-secondary); }
.menu .mi .ic { width: 12px; display: flex; justify-content: center; color: var(--text-muted); }
.menu .mi .kbd, .menu .mi .sub { margin-left: auto; padding-left: 14px; font-size: 9px; color: var(--text-muted); }
.menu .mi.check .ic { color: var(--accent); }
.menu .mi.danger { color: var(--danger); }
.menu .mi.danger:hover { background: var(--danger); color: #fff; }
.menu .mi.add { color: var(--accent); }
.menu .sep { height: 1px; background: var(--border); margin: 3px 0; }
.menu .mi-input { padding: 3px 8px; }

/* ── Editor ── */
.editor-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
    min-width: 0;
    background: var(--bg-editor);
}
.editor-title {
    display: flex; align-items: center; gap: 8px;
    padding: 4px 12px; min-height: 29px;
    border-bottom: 1px solid var(--border);
    font-size: 11px; color: var(--text-secondary);
}
.editor-title .title-name { color: var(--text-primary); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.editor-title .by { color: var(--text-muted); font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cat-select {
    margin-left: auto; flex-shrink: 0;
    display: flex; align-items: center; gap: 6px;
    padding: 2px 6px 2px 8px;
    border: 1px solid var(--border); border-radius: 4px;
    background: var(--bg-primary);
    color: var(--text-secondary); font-size: 10px;
    cursor: pointer; user-select: none;
}
.cat-select:hover, .cat-select.open { border-color: var(--accent); color: var(--text-primary); }
.cat-select .lbl { color: var(--text-muted); }
.cat-select .chev { font-size: 8px; color: var(--text-muted); }

textarea {
    flex: 1;
    background: var(--bg-editor);
    color: var(--text-primary);
    border: none;
    padding: 10px 14px;
    font-family: "Cascadia Code", "Consolas", "Courier New", monospace;
    font-size: 12px;
    line-height: 1.5;
    resize: none;
    outline: none;
    overflow-y: auto;
    tab-size: 4;
}
textarea::placeholder { color: var(--text-muted); }
textarea::-webkit-scrollbar { width: 4px; }
textarea::-webkit-scrollbar-track { background: var(--bg-primary); }
textarea::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* ── No project state ── */
.no-project {
    display: none;
    flex: 1;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: var(--text-muted);
    font-size: 12px;
    gap: 6px;
}
.no-project-icon { font-size: 28px; opacity: 0.3; }
body.no-project-state .notes-header { display: none; }
body.no-project-state .body-row { display: none; }
body.no-project-state .no-project { display: flex; }
</style>
</head>
<body>

<div class="no-project">
    <div class="no-project-icon">&#128221;</div>
    <span>Open a project to use notes</span>
</div>

<div class="notes-header">
    <span class="notes-title">Project Notes</span>
    <span class="save-status" id="save-status"></span>
</div>

<div class="body-row">
    <div class="scrim" id="scrim"></div>
    <div class="rail" id="rail">
        <div class="rail-top">
            <label class="search" id="search">
                <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="7" cy="7" r="5"/><path d="M11 11l4 4"/></svg>
                <input id="search-input" placeholder="Search notes" spellcheck="false">
                <span class="clear" id="search-clear" title="Clear (Esc)">&#10005;</span>
            </label>
            <span class="icon-btn" id="add-note" title="New note (Ctrl+T)">+</span>
            <span class="icon-btn" id="collapse-rail" title="Hide notes list">&laquo;</span>
        </div>
        <label class="unread-filter" title="Show only notes an agent changed since you last read them">
            <input type="checkbox" id="unread-only"> Unread only <span class="n" id="unread-only-count"></span>
        </label>
        <div class="rail-list" id="rail-list" tabindex="0"></div>
        <div class="resize" id="rail-resize" title="Drag to resize"></div>
        <span class="icon-btn mini" id="expand-rail" title="Show notes">&raquo;</span>
        <span class="mini-badge mini" id="mini-badge" style="display:none"></span>
        <span class="mini-sep mini"></span>
        <span class="icon-btn mini" id="mini-add" title="New note (Ctrl+T)">+</span>
    </div>
    <div class="editor-container">
        <div class="editor-title">
            <span class="title-name" id="title-name"></span>
            <span class="by" id="title-by"></span>
            <span class="cat-select" id="cat-select" title="Category"><span class="lbl">Category</span><span id="cat-current">General</span><span class="chev">&#9662;</span></span>
        </div>
        <textarea id="editor" placeholder="Type your notes here..."></textarea>
    </div>
</div>

<script>
const editor = document.getElementById('editor');
const saveStatus = document.getElementById('save-status');
const rail = document.getElementById('rail');
const railList = document.getElementById('rail-list');
const searchBox = document.getElementById('search');
const searchInput = document.getElementById('search-input');
const miniBadge = document.getElementById('mini-badge');
const scrim = document.getElementById('scrim');
const titleName = document.getElementById('title-name');
const titleBy = document.getElementById('title-by');
const catSelect = document.getElementById('cat-select');
const catCurrent = document.getElementById('cat-current');
const unreadOnlyBox = document.getElementById('unread-only');
const unreadOnlyCount = document.getElementById('unread-only-count');

const ICON = {
    pin: '<svg width="11" height="11" viewBox="0 0 16 16" fill="currentColor"><path d="M10.5 1.5l4 4-1.4 1.4-.8-.4-2.6 2.6.4 3.3-1.4 1.4-2.9-2.9-3.6 3.6-.7-.7 3.6-3.6L2.2 7.3l1.4-1.4 3.3.4 2.6-2.6-.4-.8z"/></svg>',
    pen: '<svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M11 2.5l2.5 2.5L6 12.5H3.5V10z"/></svg>',
    tag: '<svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 2h6l6 6-6 6-6-6z"/><circle cx="5.5" cy="5.5" r="1"/></svg>',
    x: '<svg width="9" height="9" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3l10 10M13 3L3 13"/></svg>',
};
const GENERAL = 'General';
const CATEGORY_MAX = 40;          // TaskDatabase.NoteCategoryMaxLength
const RAIL_MIN = 140, RAIL_MAX = 420, RAIL_DEFAULT = 215;   // SettingsService.HudNotesRail{Min,Max,Default}Width
const NARROW_PX = 380;            // below this the rail starts collapsed and opens over the editor

let tabs = [];           // [{name, content, isDefault, createdBy, updatedBy, unread, agentRev, pinned, category, changedAt}]
let categories = [GENERAL];   // the shared list, General first (host order)
// Tabs an agent wrote after the Owner last saw them. Comes from the HOST (stored read
// state, task c133b27d), so it survives a restart and agrees across panes; the page
// only clears an entry when it tells the host the tab was read.
let unreadTabs = new Set();
let hostSeen = false;     // host says the Owner can see this pane (Notes tab shown, window not minimised)
let activeTab = null;     // current tab name
let tabContents = {};     // in-memory content cache per tab
let lastSavedContent = {};
let saveTimeout = null;
let renderPending = false;  // a live update arrived mid-rename/confirm/menu; redraw when it closes
let pendingConflict = null; // {tab, by}: the next save of this tab overwrites an agent's unmergeable change

// Rail state. Width, collapsed and folded groups are one global setting kept by the host.
let railWidth = RAIL_DEFAULT;
let railCollapsed = false;
let folded = new Set();
let searchText = '';
let overlayOpen = false;     // narrow HUD only: the rail is open over the editor
// The selected note keeps the place it had when it was picked (Owner decision): reading it clears
// its dot and typing in it bumps its time, and either would otherwise make it jump under the Owner.
let sticky = null;           // {name, unread, changedAt}
let menuEl = null;           // open right-click menu / category list
let menuTarget = null;       // the row name a menu acts on
let confirmFor = null;       // {kind:'note'|'category', name}
let editing = null;          // {kind:'note'|'category', name}
let dragSrcName = null;
let unreadOnly = false;      // the "Unread only" filter (this pane, this session)
let followName = null;       // a note this pane just renamed: keep its row in view once the rename lands

function post(msg) {
    if (window.chrome && window.chrome.webview) window.chrome.webview.postMessage(msg);
}

function isNarrow() { return window.innerWidth < NARROW_PX; }

// ── Ordering: Pinned in the Owner's order, then one group per category, each unread first,
//    then newest. Stored array order is the host's tab_order, which is the pinned order.

function sortUnread(t) { return sticky && sticky.name === t.name ? sticky.unread : unreadTabs.has(t.name); }
function sortTime(t) { return sticky && sticky.name === t.name ? sticky.changedAt : (t.changedAt || 0); }
function categoryOf(t) { return categories.includes(t.category) ? t.category : GENERAL; }

function matches(t, q) {
    if (!q) return true;
    const needle = q.toLowerCase();
    return t.name.toLowerCase().includes(needle) || (tabContents[t.name] ?? t.content ?? '').toLowerCase().includes(needle);
}

function railGroups() {
    const q = searchText.trim();
    const visible = tabs.filter(t => matches(t, q) && (!unreadOnly || sortUnread(t)));
    const pinned = visible.filter(t => t.pinned);
    const groups = categories.map(c => ({
        cat: c,
        notes: visible.filter(t => !t.pinned && categoryOf(t) === c)
            .sort((a, b) => (sortUnread(b) - sortUnread(a)) || (sortTime(b) - sortTime(a))),
    })).filter(g => g.notes.length > 0);
    return { pinned, groups };
}

// Notes in the order the rail shows them (folded groups skipped), for ↑/↓.
function visibleOrder() {
    const { pinned, groups } = railGroups();
    const out = pinned.map(t => t.name);
    groups.forEach(g => { if (filtering() || !folded.has(g.cat)) g.notes.forEach(t => out.push(t.name)); });
    return out;
}

// The note at the top of the rail, for when there is no current one. Stored order is the pinned
// order, not the rail's, so tabs[0] can sit mid-list.
function firstRailNote() {
    const order = visibleOrder();
    return order.length ? order[0] : (tabs.length ? tabs[0].name : null);
}

// Search and the unread filter both open folded groups: a fold must not hide a match.
function filtering() { return !!searchText.trim() || unreadOnly; }

function setSticky(name) {
    const t = tabs.find(x => x.name === name);
    sticky = t ? { name, unread: unreadTabs.has(name), changedAt: t.changedAt || 0 } : null;
}

// ── Rendering ──

function ago(ms) {
    if (!ms) return '';
    const m = Math.max(0, Math.round((Date.now() - ms) / 60000));
    if (m < 1) return 'now';
    if (m < 60) return m + 'm';
    if (m < 1440) return Math.round(m / 60) + 'h';
    return Math.round(m / 1440) + 'd';
}

// Text with the first match highlighted. User text only ever reaches the DOM as text nodes.
function highlighted(text, q) {
    const frag = document.createDocumentFragment();
    const i = q ? text.toLowerCase().indexOf(q.toLowerCase()) : -1;
    if (i < 0) { frag.appendChild(document.createTextNode(text)); return frag; }
    frag.appendChild(document.createTextNode(text.slice(0, i)));
    const mark = document.createElement('mark');
    mark.textContent = text.slice(i, i + q.length);
    frag.appendChild(mark);
    frag.appendChild(document.createTextNode(text.slice(i + q.length)));
    return frag;
}

function snippetText(content, q) {
    const flat = content.replace(/\s+/g, ' ');
    const i = flat.toLowerCase().indexOf(q.toLowerCase());
    const start = Math.max(0, i - 14);
    return (start > 0 ? '…' : '') + flat.slice(start, start + 70);
}

function tabAuthorText(tab) {
    let text = `Written by ${tab.createdBy}`;
    if (tab.updatedBy !== tab.createdBy) text += `, last edited by ${tab.updatedBy || 'you'}`;
    return text;
}

function renderRow(t, q) {
    const row = document.createElement('div');
    row.className = 'row' + (unreadTabs.has(t.name) ? ' unread' : '') + (t.name === activeTab ? ' active' : '')
        + (t.name === menuTarget ? ' menu-target' : '');
    row.dataset.name = t.name;
    if (t.createdBy) {
        const agent = document.createElement('span');
        agent.className = 'agent';
        agent.textContent = '✦';
        row.title = tabAuthorText(t);
        row.appendChild(agent);
    }
    const wrap = document.createElement('span');
    wrap.className = 'name-wrap';
    if (editing && editing.kind === 'note' && editing.name === t.name) {
        wrap.appendChild(inlineEditor(t.name, commitNoteRename));
    } else {
        const name = document.createElement('span');
        name.className = 'name';
        name.appendChild(highlighted(t.name, q));
        wrap.appendChild(name);
        if (q && !t.name.toLowerCase().includes(q.toLowerCase())) {
            const snip = document.createElement('span');
            snip.className = 'snippet';
            snip.appendChild(highlighted(snippetText(tabContents[t.name] ?? t.content ?? '', q), q));
            wrap.appendChild(snip);
        }
    }
    row.appendChild(wrap);
    if (unreadTabs.has(t.name)) {
        const dot = document.createElement('span');
        dot.className = 'dot';
        dot.title = 'Unread';
        row.appendChild(dot);
    }
    const time = document.createElement('span');
    time.className = 'time';
    time.textContent = ago(t.changedAt);
    row.appendChild(time);

    if (t.pinned && !q) {
        row.draggable = true;
        row.addEventListener('dragstart', onDragStart);
        row.addEventListener('dragover', onDragOver);
        row.addEventListener('dragleave', onDragLeave);
        row.addEventListener('drop', onDrop);
        row.addEventListener('dragend', onDragEnd);
    }
    row.addEventListener('click', () => { if (!editing) selectNote(t.name); });
    row.addEventListener('dblclick', () => startNoteRename(t.name));
    row.addEventListener('contextmenu', (e) => { e.preventDefault(); showNoteMenu(t.name, e.clientX, e.clientY); });
    return row;
}

function renderGroupHeader(cat, count, isFolded, hasUnread) {
    const head = document.createElement('div');
    head.className = 'group';
    head.dataset.cat = cat;
    const caret = document.createElement('span');
    caret.className = 'caret';
    caret.textContent = isFolded ? '▸' : '▾';
    head.appendChild(caret);
    if (editing && editing.kind === 'category' && editing.name === cat) {
        const input = inlineEditor(cat, commitCategoryRename);
        input.classList.add('group-edit');
        head.appendChild(input);
    } else {
        head.appendChild(document.createTextNode(cat + ' '));
        const c = document.createElement('span');
        c.className = 'count';
        c.textContent = String(count);
        head.appendChild(c);
    }
    if (isFolded && hasUnread) {
        const dot = document.createElement('span');
        dot.className = 'dot gdot';
        dot.title = 'Unread notes inside';
        head.appendChild(dot);
    }
    head.addEventListener('click', () => { if (!editing) toggleFold(cat); });
    head.addEventListener('contextmenu', (e) => { e.preventDefault(); showCategoryMenu(cat, e.clientX, e.clientY); });
    return head;
}

function confirmEl(text, onYes) {
    const box = document.createElement('div');
    box.className = 'confirm';
    const label = document.createElement('span');
    label.textContent = text;
    const yes = document.createElement('button');
    yes.className = 'btn-yes';
    yes.textContent = 'Delete';
    const no = document.createElement('button');
    no.className = 'btn-no';
    no.textContent = 'Cancel';
    yes.addEventListener('click', (e) => { e.stopPropagation(); confirmFor = null; onYes(); renderRail(); });
    no.addEventListener('click', (e) => { e.stopPropagation(); confirmFor = null; renderRail(); });
    box.append(label, yes, no);
    return box;
}

function renderRail() {
    renderPending = false;
    const q = searchText.trim();
    const narrow = isNarrow();
    const collapsed = narrow ? !overlayOpen : railCollapsed;
    rail.classList.toggle('collapsed', collapsed);
    rail.classList.toggle('overlay', narrow && overlayOpen);
    document.body.classList.toggle('overlay-open', narrow && overlayOpen);
    rail.style.width = railWidth + 'px';
    searchBox.classList.toggle('has-text', searchText.length > 0);

    const n = unreadTabs.size;
    miniBadge.style.display = n > 0 ? '' : 'none';
    miniBadge.textContent = n > 99 ? '99+' : String(n);
    miniBadge.title = `${n} unread`;
    unreadOnlyCount.textContent = n > 0 ? `(${n})` : '';
    unreadOnlyBox.checked = unreadOnly;

    const scrollTop = railList.scrollTop;
    // Rebuilding removes a focused inline editor, and a removal can fire blur: mark it cancelled so
    // that blur can never commit half-typed text, and carry the typing into the rebuilt editor.
    const oldEditor = railList.querySelector('.inline-edit');
    const pendingText = oldEditor ? oldEditor.value : null;
    if (oldEditor) oldEditor.dataset.cancelled = '1';
    railList.innerHTML = '';
    const { pinned, groups } = railGroups();
    if (pinned.length) {
        const head = document.createElement('div');
        head.className = 'group pinned-head';
        head.innerHTML = `<span class="caret">${ICON.pin}</span>Pinned <span class="count">${pinned.length}</span>`;
        railList.appendChild(head);
        pinned.forEach(t => appendRow(t, q));
    }
    groups.forEach(g => {
        const isFolded = !filtering() && folded.has(g.cat);
        railList.appendChild(renderGroupHeader(g.cat, g.notes.length, isFolded, g.notes.some(t => unreadTabs.has(t.name))));
        if (!isFolded) g.notes.forEach(t => appendRow(t, q));
    });
    if (!pinned.length && !groups.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = q ? `No note matches "${q}"${unreadOnly ? ' among unread notes' : ''}`
            : unreadOnly ? 'No unread notes' : 'No notes yet';
        railList.appendChild(empty);
    }
    railList.scrollTop = scrollTop;
    renderTitle();
    const newEditor = railList.querySelector('.inline-edit');
    if (newEditor && pendingText !== null) newEditor.value = pendingText;
    // An edit whose row is not drawn would leave every row and header click ignored; drop it.
    if (editing && !newEditor) editing = null;
    // A rename re-sorts by time; keep the renamed row in view rather than wherever the list lands
    // (Owner live test of 9a4a9d5e, step 5).
    if (followName) {
        const row = Array.from(railList.querySelectorAll('.row')).find(r => r.dataset.name === followName);
        if (row) { row.scrollIntoView({ block: 'nearest' }); followName = null; }
    }
    focusInlineEditor();
}

function appendRow(t, q) {
    railList.appendChild(renderRow(t, q));
    if (confirmFor && confirmFor.kind === 'note' && confirmFor.name === t.name) {
        railList.appendChild(confirmEl('Delete?', () => post({ type: 'delete_tab', tabName: t.name })));
    }
}

function renderTitle() {
    const tab = tabs.find(t => t.name === activeTab);
    titleName.textContent = tab ? tab.name : '';
    titleBy.textContent = tab && tab.createdBy ? `✦ ${tabAuthorText(tab)}` : '';
    catSelect.style.visibility = tab ? '' : 'hidden';
    catCurrent.textContent = tab ? categoryOf(tab) : GENERAL;
}

function scrollActiveRowIntoView() {
    const row = Array.from(railList.querySelectorAll('.row')).find(r => r.dataset.name === activeTab);
    if (row) row.scrollIntoView({ block: 'nearest' });
}

// ── Selecting a note ──

function selectNote(name) {
    switchTab(name);
    if (isNarrow() && overlayOpen) { overlayOpen = false; renderRail(); }
}

function switchTab(name) {
    if (activeTab === name) return;
    // Save current tab content to cache before switching
    if (activeTab) {
        tabContents[activeTab] = editor.value;
        // Flush any pending save
        if (saveTimeout) { clearTimeout(saveTimeout); saveTimeout = null; saveCurrentTab(); }
    }
    activeTab = name;
    setSticky(name);
    markActiveRead();
    editor.value = tabContents[name] || '';
    lastSavedContent[name] = tabContents[name] || '';
    saveStatus.textContent = '';
    saveStatus.className = 'save-status';
    renderRail();
    scrollActiveRowIntoView();
}

function saveCurrentTab() {
    if (!activeTab) return;
    const content = editor.value;
    if (content === lastSavedContent[activeTab]) return;

    saveStatus.textContent = 'Saving...';
    saveStatus.className = 'save-status saving';

    tabContents[activeTab] = content;
    const saved = tabs.find(t => t.name === activeTab);
    if (saved) saved.changedAt = Date.now(); // its time; the sticky place keeps it from jumping

    post({ type: 'save_tab', tabName: activeTab, content: content });

    lastSavedContent[activeTab] = content;

    // A save that overwrites an agent's unmergeable change (see mergeTabs) must not
    // replace the conflict warning with a cheerful "Saved" a moment later: say what
    // was saved over, and leave it up until the Owner moves on.
    if (pendingConflict && pendingConflict.tab === activeTab) {
        saveStatus.textContent = `Saved your version over ${pendingConflict.by}'s change`;
        saveStatus.className = 'save-status conflict';
        pendingConflict = null;
        return;
    }

    setTimeout(() => {
        saveStatus.textContent = 'Saved';
        saveStatus.className = 'save-status saved';
        setTimeout(() => {
            if (saveStatus.textContent === 'Saved') {
                saveStatus.textContent = '';
                saveStatus.className = 'save-status';
            }
        }, 2000);
    }, 200);
}

// ── New note ──

function addNewTab() {
    let baseName = 'New Note';
    let name = baseName;
    let counter = 1;
    const existing = new Set(tabs.map(t => t.name.toLowerCase()));
    while (existing.has(name.toLowerCase())) {
        counter++;
        name = `${baseName} ${counter}`;
    }
    post({ type: 'add_tab', tabName: name });
}
document.getElementById('add-note').addEventListener('click', addNewTab);
document.getElementById('mini-add').addEventListener('click', addNewTab);

// ── Inline rename (notes and categories) ──

function inlineEditor(value, commit) {
    const input = document.createElement('input');
    input.className = 'inline-edit';
    input.type = 'text';
    input.value = value;
    input.dataset.original = value;
    let done = false;
    const finish = (save) => {
        if (done || input.dataset.cancelled) return;
        done = true;
        const original = input.dataset.original;
        const next = input.value.trim();
        editing = null;
        if (save) commit(original, next);
        renderRail();
        flushPendingRender();
    };
    input.addEventListener('click', (e) => e.stopPropagation());
    input.addEventListener('blur', () => finish(true));
    input.addEventListener('keydown', (e) => {
        e.stopPropagation();
        if (e.key === 'Enter') { e.preventDefault(); finish(true); }
        if (e.key === 'Escape') { e.preventDefault(); finish(false); }
    });
    return input;
}

function focusInlineEditor() {
    const input = railList.querySelector('.inline-edit');
    if (input && document.activeElement !== input) { input.focus(); input.select(); }
}

// Rename and delete act on a row in the rail, so first make sure it is drawn: its group unfolded,
// a search that hides it cleared, the rail open. F2, Ctrl+W and Del reach notes the rail is hiding.
function revealNote(name) {
    const t = tabs.find(n => n.name === name);
    if (!t) return;
    if (searchText.trim() && !matches(t, searchText.trim())) { searchText = ''; searchInput.value = ''; }
    const cat = categoryOf(t);
    if (!t.pinned && folded.has(cat)) { folded.delete(cat); sendRailState(); }
    if (isNarrow()) overlayOpen = true;
    else if (railCollapsed) { railCollapsed = false; sendRailState(); }
}

function startNoteRename(name) {
    hideMenu();
    revealNote(name);
    editing = { kind: 'note', name };
    confirmFor = null;
    renderRail();
}

function commitNoteRename(oldName, newName) {
    if (newName && newName !== oldName && !tabs.some(t => t.name.toLowerCase() === newName.toLowerCase())) {
        followName = newName;
        post({ type: 'rename_tab', oldName, newName });
    }
}

function startCategoryRename(cat) {
    hideMenu();
    editing = { kind: 'category', name: cat };
    renderRail();
}

function commitCategoryRename(oldName, newName) {
    if (!validCategoryName(newName) || newName === oldName || newName.toLowerCase() === GENERAL.toLowerCase()) return;
    if (categories.some(c => c !== oldName && c.toLowerCase() === newName.toLowerCase())) return;
    if (folded.has(oldName)) { folded.delete(oldName); folded.add(newName); sendRailState(); }
    post({ type: 'rename_category', oldName, newName });
}

function validCategoryName(name) {
    return !!name && name.length <= CATEGORY_MAX && !/[\u0000-\u001f\u007f]/.test(name);
}

// ── Right-click menus and the category list ──

function menuItem(icon, label, onClick, opts = {}) {
    const mi = document.createElement('div');
    mi.className = 'mi' + (opts.cls ? ' ' + opts.cls : '') + (opts.disabled ? ' disabled' : '');
    mi.innerHTML = `<span class="ic">${icon || ''}</span>`;
    mi.appendChild(document.createTextNode(label));
    if (opts.hint) {
        const hint = document.createElement('span');
        hint.className = opts.sub ? 'sub' : 'kbd';
        hint.textContent = opts.hint;
        mi.appendChild(hint);
    }
    if (!opts.disabled) mi.addEventListener('click', (e) => { e.stopPropagation(); onClick(mi); });
    return mi;
}

function separator() {
    const sep = document.createElement('div');
    sep.className = 'sep';
    return sep;
}

function openMenu(el, x, y) {
    hideMenu();
    menuEl = el;
    menuEl.className = 'menu';
    document.body.appendChild(menuEl);
    const w = menuEl.offsetWidth, h = menuEl.offsetHeight;
    menuEl.style.left = Math.max(4, Math.min(x, window.innerWidth - w - 4)) + 'px';
    menuEl.style.top = Math.max(4, Math.min(y, window.innerHeight - h - 4)) + 'px';
    // Deferred so the click that opened the menu doesn't immediately close it.
    setTimeout(() => {
        if (!menuEl) return;
        document.addEventListener('mousedown', onMenuOutside, true);
        document.addEventListener('keydown', onMenuKeydown, true);
    }, 0);
}

function hideMenu() {
    if (menuEl) { menuEl.remove(); menuEl = null; }
    catSelect.classList.remove('open');
    document.removeEventListener('mousedown', onMenuOutside, true);
    document.removeEventListener('keydown', onMenuKeydown, true);
    if (menuTarget) { menuTarget = null; renderRailWhenIdle(); }
    flushPendingRender();
}

// The category dropdown's own button toggles the list in its click handler; closing it here first
// would make that click reopen it.
function onMenuOutside(e) {
    if (menuEl && !menuEl.contains(e.target) && !catSelect.contains(e.target)) hideMenu();
}
function onMenuKeydown(e) {
    if (e.key === 'Escape' && !(e.target && e.target.classList && e.target.classList.contains('inline-edit'))) {
        e.preventDefault(); e.stopPropagation(); hideMenu();
    }
}

function showNoteMenu(name, x, y) {
    const t = tabs.find(n => n.name === name);
    if (!t) return;
    const menu = document.createElement('div');
    menu.appendChild(menuItem(ICON.pin, t.pinned ? 'Unpin' : 'Pin to top', () => { hideMenu(); post({ type: 'pin_tab', tabName: name, pinned: !t.pinned }); }));
    menu.appendChild(menuItem(ICON.pen, 'Rename', () => startNoteRename(name), { hint: 'F2' }));
    menu.appendChild(menuItem(ICON.tag, 'Category', (mi) => {
        const r = mi.getBoundingClientRect();
        showCategoryList(name, r.right - 4, r.top);
    }, { hint: categoryOf(t) + ' ▸', sub: true }));
    menu.appendChild(separator());
    menu.appendChild(menuItem(ICON.x, 'Delete', () => askDeleteNote(name), { cls: 'danger', hint: 'Del', disabled: t.isDefault }));
    openMenu(menu, x, y);
    menuTarget = name;
    renderRail();
}

function showCategoryMenu(cat, x, y) {
    if (cat === GENERAL) return; // built in: cannot be renamed or deleted
    const menu = document.createElement('div');
    menu.appendChild(menuItem(ICON.pen, 'Rename category', () => startCategoryRename(cat)));
    // The host asks in a standard message box (Owner request): an inline confirm is cut off at a
    // normal rail width, and this delete reaches notes in every project.
    menu.appendChild(menuItem(ICON.x, 'Delete category…', () => { hideMenu(); post({ type: 'delete_category', name: cat }); },
        { cls: 'danger', hint: `notes → ${GENERAL}`, sub: true }));
    openMenu(menu, x, y);
}

// The category list: "Add…" on top, then every category, General first. Used by the editor's
// dropdown and by the right-click menu's Category entry; both file the given note.
function showCategoryList(tabName, x, y) {
    const t = tabs.find(n => n.name === tabName);
    if (!t) return;
    const keepTarget = menuTarget;
    const menu = document.createElement('div');
    const add = menuItem('+', 'Add…', () => {
        const box = document.createElement('div');
        box.className = 'mi-input';
        const input = document.createElement('input');
        input.className = 'inline-edit';
        input.placeholder = 'New category name';
        input.maxLength = CATEGORY_MAX;
        input.addEventListener('keydown', (e) => {
            e.stopPropagation();
            if (e.key === 'Enter') {
                e.preventDefault();
                const name = input.value.trim();
                if (!validCategoryName(name)) return;
                hideMenu();
                post({ type: 'add_category', name, tabName });
            }
            if (e.key === 'Escape') { e.preventDefault(); box.replaceWith(add); }
        });
        box.appendChild(input);
        add.replaceWith(box);
        input.focus();
    }, { cls: 'add' });
    menu.appendChild(add);
    menu.appendChild(separator());
    const current = categoryOf(t);
    categories.forEach(c => {
        menu.appendChild(menuItem(c === current ? '✓' : '', c, () => {
            hideMenu();
            if (c !== current) post({ type: 'set_category', tabName, category: c });
        }, { cls: c === current ? 'check' : '' }));
    });
    openMenu(menu, x, y);
    menuTarget = keepTarget;
}

catSelect.addEventListener('click', (e) => {
    e.stopPropagation();
    if (!activeTab) return;
    if (menuEl && catSelect.classList.contains('open')) { hideMenu(); return; }
    const r = catSelect.getBoundingClientRect();
    showCategoryList(activeTab, r.right - 170, r.bottom + 2);
    catSelect.classList.add('open');
});

function askDeleteNote(name) {
    const t = tabs.find(n => n.name === name);
    hideMenu();
    if (!t || t.isDefault) return;
    revealNote(name);
    confirmFor = { kind: 'note', name };
    renderRail();
}

// ── Folding, collapsing, resizing ──

function toggleFold(cat) {
    if (folded.has(cat)) folded.delete(cat); else folded.add(cat);
    sendRailState();
    renderRail();
}

// A narrow pane does not send "collapsed": its forced collapse must not overwrite the wide panes' setting.
function sendRailState() {
    const msg = { type: 'rail_state', width: railWidth, folded: Array.from(folded) };
    if (!isNarrow()) msg.collapsed = railCollapsed;
    post(msg);
}

document.getElementById('collapse-rail').addEventListener('click', () => {
    hideMenu();
    if (isNarrow()) overlayOpen = false;
    else { railCollapsed = true; sendRailState(); }
    renderRail();
});
document.getElementById('expand-rail').addEventListener('click', () => {
    if (isNarrow()) overlayOpen = true;
    else { railCollapsed = false; sendRailState(); }
    renderRail();
});
scrim.addEventListener('click', () => { overlayOpen = false; renderRail(); });

document.getElementById('rail-resize').addEventListener('mousedown', (e) => {
    e.preventDefault();
    const startX = e.clientX, startW = railWidth;
    document.body.classList.add('resizing');
    const move = (ev) => {
        railWidth = Math.max(RAIL_MIN, Math.min(RAIL_MAX, startW + ev.clientX - startX));
        rail.style.width = railWidth + 'px';
    };
    const up = () => {
        document.body.classList.remove('resizing');
        document.removeEventListener('mousemove', move);
        document.removeEventListener('mouseup', up);
        sendRailState();
    };
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
});

let wasNarrow = isNarrow();
window.addEventListener('resize', () => {
    hideMenu();
    const narrow = isNarrow();
    if (narrow !== wasNarrow) { wasNarrow = narrow; overlayOpen = false; renderRail(); }
});

// ── Search ──

searchInput.addEventListener('input', () => { searchText = searchInput.value; renderRail(); });
unreadOnlyBox.addEventListener('change', () => { unreadOnly = unreadOnlyBox.checked; renderRail(); });
document.getElementById('search-clear').addEventListener('click', (e) => {
    e.preventDefault();
    searchInput.value = '';
    searchText = '';
    renderRail();
    searchInput.focus();
});
searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { e.preventDefault(); searchInput.value = ''; searchText = ''; renderRail(); }
    else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); moveSelection(e.key === 'ArrowDown' ? 1 : -1); }
    else if (e.key === 'Enter') { e.preventDefault(); editor.focus(); }
});
railList.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); moveSelection(e.key === 'ArrowDown' ? 1 : -1); }
    else if (e.key === 'Delete' && activeTab) { e.preventDefault(); askDeleteNote(activeTab); }
});

function moveSelection(step) {
    const order = visibleOrder();
    if (!order.length) return;
    const i = order.indexOf(activeTab);
    const next = order[Math.max(0, Math.min(order.length - 1, i < 0 ? 0 : i + step))];
    if (next && next !== activeTab) switchTab(next);
}

// ── Drag to reorder: the pinned group only ──

function onDragStart(e) {
    dragSrcName = e.currentTarget.dataset.name;
    e.currentTarget.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', dragSrcName);
}

function dropBefore(e, row) {
    const rect = row.getBoundingClientRect();
    return e.clientY < rect.top + rect.height / 2;
}

function onDragOver(e) {
    if (!dragSrcName) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    const row = e.currentTarget;
    clearDropIndicators();
    if (row.dataset.name === dragSrcName) return;
    row.classList.add(dropBefore(e, row) ? 'drop-above' : 'drop-below');
}

function onDragLeave(e) { e.currentTarget.classList.remove('drop-above', 'drop-below'); }

function onDrop(e) {
    e.preventDefault();
    const row = e.currentTarget;
    const targetName = row.dataset.name;
    const before = dropBefore(e, row);
    clearDropIndicators();
    if (!dragSrcName || dragSrcName === targetName) return;
    const pinnedNames = tabs.filter(t => t.pinned).map(t => t.name);
    const from = pinnedNames.indexOf(dragSrcName);
    if (from < 0 || pinnedNames.indexOf(targetName) < 0) return;
    pinnedNames.splice(from, 1);
    let to = pinnedNames.indexOf(targetName);
    if (!before) to++;
    pinnedNames.splice(to, 0, dragSrcName);
    // Reflect the new order straight away; the host's announcement then confirms it.
    const pinnedTabs = pinnedNames.map(n => tabs.find(t => t.name === n));
    tabs = pinnedTabs.concat(tabs.filter(t => !t.pinned));
    renderRail();
    post({ type: 'reorder_tabs', tabNames: pinnedNames });
}

function onDragEnd(e) {
    e.currentTarget.classList.remove('dragging');
    clearDropIndicators();
    dragSrcName = null;
}

function clearDropIndicators() {
    railList.querySelectorAll('.drop-above, .drop-below').forEach(el => el.classList.remove('drop-above', 'drop-below'));
}

// ── Auto-save ──

editor.addEventListener('input', () => {
    if (saveTimeout) clearTimeout(saveTimeout);
    if (activeTab) tabContents[activeTab] = editor.value;
    saveStatus.textContent = 'Unsaved changes';
    saveStatus.className = 'save-status';
    saveTimeout = setTimeout(saveCurrentTab, 1000);
});

editor.addEventListener('blur', () => {
    if (saveTimeout) { clearTimeout(saveTimeout); saveTimeout = null; }
    saveCurrentTab();
});

// ── Keyboard shortcuts ──

document.addEventListener('keydown', (e) => {
    // Ctrl+S: save
    if ((e.ctrlKey || e.metaKey) && e.key === 's') {
        e.preventDefault();
        if (saveTimeout) { clearTimeout(saveTimeout); saveTimeout = null; }
        saveCurrentTab();
    }
    // Ctrl+T: new note
    if ((e.ctrlKey || e.metaKey) && e.key === 't') {
        e.preventDefault();
        addNewTab();
    }
    // Ctrl+F: search the notes
    if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
        e.preventDefault();
        if (isNarrow()) overlayOpen = true;
        else if (railCollapsed) { railCollapsed = false; sendRailState(); }
        renderRail();
        searchInput.focus();
        searchInput.select();
    }
    // F2: rename the selected note
    if (e.key === 'F2' && activeTab) {
        e.preventDefault();
        startNoteRename(activeTab);
    }
    // Ctrl+W: delete the current note (with the confirm), unless it is the default one
    if ((e.ctrlKey || e.metaKey) && e.key === 'w') {
        if (activeTab) {
            const tab = tabs.find(t => t.name === activeTab);
            if (tab && !tab.isDefault) {
                e.preventDefault();
                askDeleteNote(activeTab);
            }
        }
    }
});

// ── WebView2 message protocol ──

// Content is normalized to LF because a textarea's value is always LF: a stored
// CRLF note (an agent writing through REST on Windows) would otherwise compare as
// "dirty" against the editor with no typing at all.
function toTabModel(t) {
    return { name: t.name, content: (t.content || '').replace(/\r\n?/g, '\n'), isDefault: t.isDefault,
             createdBy: t.createdBy || null, updatedBy: t.updatedBy || null,
             unread: !!t.unread, agentRev: Number(t.agentRev) || 0,
             pinned: !!t.pinned, category: t.category || GENERAL, changedAt: Number(t.changedAt) || 0 };
}

function takeCategories(data) {
    if (Array.isArray(data.categories) && data.categories.length) categories = data.categories.slice();
    // A folded group that no longer exists (renamed or deleted elsewhere) is forgotten.
    let changed = false;
    folded.forEach(c => { if (!categories.includes(c)) { folded.delete(c); changed = true; } });
    if (changed) sendRailState();
}

function syncUnreadFromTabs() {
    unreadTabs = new Set(tabs.filter(t => t.unread).map(t => t.name));
}

// The active tab counts as read only while the host says the Owner can see it.
// Sends the revision this page is SHOWING, so an agent write that has not reached
// the page yet stays unread. The host re-checks visibility before storing it.
function markActiveRead() {
    if (!hostSeen || !activeTab || !unreadTabs.has(activeTab)) return false;
    const tab = tabs.find(t => t.name === activeTab);
    if (!tab) return false;
    unreadTabs.delete(activeTab);
    tab.unread = false;
    post({ type: 'mark_read', tabName: activeTab, rev: tab.agentRev });
    return true;
}

// What an agent's append added to `base`, or null when `stored` is not an append
// of it. Mirrors TaskDatabase.WriteAgentNoteTab: base.TrimEnd() + "\n\n" + text,
// or just text when base was EMPTY. The branch is on the untrimmed length, as in C#:
// a whitespace-only base still gets the separator there.
function appendedSuffix(base, stored) {
    if (base.length === 0) return stored.length > 0 ? stored : null;
    const trimmed = base.trimEnd();
    const head = trimmed + '\n\n';
    return stored.length > head.length && stored.startsWith(head) ? stored.slice(trimmed.length) : null;
}

// The Owner renamed a tab in ANOTHER pane (task c133b27d). Move this page's state for
// it to the new name before merging, so the current tab and any unsaved typing in it
// survive instead of the merge treating the tab as deleted. A pane that already has
// the new name (the one that did the rename) has nothing under the old one: no-op.
function renameLocalTab(from, to) {
    if (!from || !to || from === to || !(from in tabContents) || (to in tabContents)) return;
    tabContents[to] = tabContents[from];
    delete tabContents[from];
    if (from in lastSavedContent) {
        lastSavedContent[to] = lastSavedContent[from];
        delete lastSavedContent[from];
    }
    if (activeTab === from) activeTab = to;
    if (sticky && sticky.name === from) sticky.name = to;
    if (pendingConflict && pendingConflict.tab === from) pendingConflict.tab = to;
}

// Live update after an agent wrote a note (task 5d94ac91), or after another pane changed
// the list. A MERGE, not a reload: the Owner keeps the note they are on, and unsaved typing
// in it is never replaced. Every other note, and a clean active note, takes the stored text.
//
// When the active note has unsaved typing AND an agent changed that same note, the
// pending save would write the Owner's buffer over the agent's change, which the
// agent was already told had succeeded. So an append is carried INTO the buffer
// (the Owner's text, then the agent's addition) and saved with it. Anything that is
// not an append (a replace) cannot be merged; the Owner's text still wins, but the
// status line says so instead of losing the agent's version silently.
function mergeTabs(data) {
    if (document.body.classList.contains('no-project-state')) return;
    if (data.renamed) renameLocalTab(data.renamed.from, data.renamed.to);
    takeCategories(data);
    const base = activeTab ? (lastSavedContent[activeTab] ?? '') : '';
    const activeDirty = !!activeTab && editor.value !== base;
    tabs = (data.tabs || []).map(toTabModel);

    const nextContents = {};
    const nextSaved = {};
    let conflictBy = null;
    let caretCap = null;  // after a merge, the caret must not land inside the agent's suffix
    tabs.forEach(t => {
        nextSaved[t.name] = t.content;
        nextContents[t.name] = t.content;
        if (t.name === activeTab && activeDirty) {
            nextContents[t.name] = editor.value;
            if (t.content !== base) {
                const suffix = appendedSuffix(base, t.content);
                if (suffix !== null) {
                    const own = editor.value.trimEnd();
                    nextContents[t.name] = own + (base.length === 0 && own.length > 0 ? '\n\n' : '') + suffix;
                    caretCap = own.length;
                } else {
                    conflictBy = data.changedBy || t.updatedBy || 'an agent';
                }
            }
        }
    });
    tabContents = nextContents;
    lastSavedContent = nextSaved;

    if (!activeTab || !tabs.some(t => t.name === activeTab)) {
        activeTab = firstRailNote();
        editor.value = activeTab ? (tabContents[activeTab] || '') : '';
        setSticky(activeTab);
    } else if (editor.value !== tabContents[activeTab]) {
        // The active note's text changed underneath (a clean note taking the stored
        // text, or a dirty one gaining an agent's append at the end): keep caret and scroll.
        const { selectionStart, selectionEnd, scrollTop } = editor;
        editor.value = tabContents[activeTab];
        const cap = caretCap ?? editor.value.length;
        editor.setSelectionRange(Math.min(selectionStart, cap), Math.min(selectionEnd, cap));
        editor.scrollTop = scrollTop;
    }
    if (conflictBy) {
        pendingConflict = { tab: activeTab, by: conflictBy };
        saveStatus.textContent = `${conflictBy} rewrote this note while you were editing; your version will be saved`;
        saveStatus.className = 'save-status conflict';
    }
    if (confirmFor && confirmFor.kind === 'note' && !tabs.some(t => t.name === confirmFor.name)) confirmFor = null;
    syncUnreadFromTabs();
    markActiveRead();
    renderRailWhenIdle();
}

// Read state changed elsewhere (another pane read or deleted a note): refresh the
// flags only. Content and the Owner's typing are untouched.
function applyUnreadState(data) {
    const byName = new Map((data.tabs || []).map(t => [t.name, t]));
    tabs.forEach(t => {
        const s = byName.get(t.name);
        // A tab the host no longer has cannot be unread; keeping its old flag would
        // leave a dot and a count that disagree with the header badge.
        if (s) { t.unread = !!s.unread; t.agentRev = Number(s.agentRev) || 0; }
        else t.unread = false;
    });
    syncUnreadFromTabs();
    markActiveRead();
    renderRailWhenIdle();
}

// A live update must not tear down what the Owner is in the middle of: an inline
// rename or an open menu. The data above is already merged; only the redraw waits
// until they are gone. (A delete confirm needs no wait: it is redrawn from confirmFor.)
function railBusy() { return !!railList.querySelector('.inline-edit') || !!menuEl; }

function renderRailWhenIdle() {
    if (railBusy()) {
        renderPending = true;
        return;
    }
    renderRail();
}
function flushPendingRender() {
    if (!renderPending) return;
    // Deferred so it runs after the closing click/commit has finished its own work.
    setTimeout(() => { if (renderPending) renderRailWhenIdle(); }, 0);
}

function loadAllTabs(data) {
    document.body.classList.remove('no-project-state');
    takeCategories(data);
    tabs = (data.tabs || []).map(toTabModel);

    // Populate content cache
    tabContents = {};
    lastSavedContent = {};
    tabs.forEach(t => {
        tabContents[t.name] = t.content;
        lastSavedContent[t.name] = t.content;
    });

    // If host specified an active tab (e.g. after add), switch to it; otherwise preserve current
    if (data.activeTab && tabs.some(t => t.name === data.activeTab)) {
        activeTab = data.activeTab;
    } else if (!activeTab || !tabs.some(t => t.name === activeTab)) {
        activeTab = firstRailNote();
    }

    editor.value = activeTab ? (tabContents[activeTab] || '') : '';
    saveStatus.textContent = '';
    saveStatus.className = 'save-status';
    syncUnreadFromTabs();
    setSticky(activeTab);
    markActiveRead();
    confirmFor = null;
    editing = null;
    renderRail();
    scrollActiveRowIntoView();
}

function applyRailState(data) {
    railWidth = Math.max(RAIL_MIN, Math.min(RAIL_MAX, Number(data.width) || RAIL_DEFAULT));
    railCollapsed = !!data.collapsed;
    folded = new Set(Array.isArray(data.folded) ? data.folded : []);
    renderRailWhenIdle();
}

// Relative times ("3m") age while the pane is open.
setInterval(() => { if (!railBusy() && tabs.length) renderRail(); }, 60000);

if (window.chrome && window.chrome.webview) {
    window.chrome.webview.postMessage({ type: 'ready' });

    window.chrome.webview.addEventListener('message', (event) => {
        const data = event.data;
        if (!data || typeof data !== 'object') return;

        switch (data.type) {
            case 'notes_changed':
                mergeTabs(data);
                break;
            case 'load_all_tabs':
                loadAllTabs(data);
                break;
            case 'unread_state':
                applyUnreadState(data);
                break;
            case 'rail_state':
                applyRailState(data);
                break;
            case 'seen':
                hostSeen = !!data.seen;
                if (markActiveRead()) renderRailWhenIdle();
                break;
            case 'load_notes':
                // Legacy fallback: treat as single "General" tab
                loadAllTabs({ tabs: [{ name: 'General', content: data.content || '', isDefault: true }] });
                break;
            case 'theme':
                document.body.classList.toggle('light', !data.isDark);
                break;
            case 'no_project':
                hideMenu();
                confirmFor = null;
                editing = null;
                document.body.classList.add('no-project-state');
                break;
        }
    });
}
</script>
</body>
</html>
